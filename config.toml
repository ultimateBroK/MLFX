# MLFX – Quickstart Configuration
# This file is read by the `mlfx` CLI and `mlfx-tui`.
# Edit these defaults to match your workflow.

[download]
symbol      = "XAUUSD"
asset_class = "fx"        # "fx" | "crypto"
start_year  = 2015
start_month = 1
concurrency = 20

[pipeline]
symbol       = "XAUUSD"
timeframe    = "1H"         # "1m" | "5m" | "15m" | "30m" | "1H" | "2H" | "4H" | "1D"
pivot_type   = "traditional"
pivot_anchor = "daily"

[train]
symbol     = "XAUUSD"
timeframe  = "1H"
label_col  = "label_10"
backend    = "mlf"       # "mlf" | "lstm" | "transformer" | "cnn_lstm" | "sgd" | "stats" | "neuralforecast"
n_trials   = 30
n_splits   = 5

[features]
rsi_period  = 14
atr_period  = 14
ema_periods = [20, 50, 200]
macd_fast   = 12
macd_slow   = 26
macd_signal = 9
avg_range_n = 5

[backtest]
symbol          = "XAUUSD"
timeframe       = "1H"
label_col       = "label_10"
tp_r            = 1.5
sl_r            = 1.0
initial_capital = 10000.0
risk_pct        = 1.0
commission      = 0.1
