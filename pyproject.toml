[project]
authors = [{ name = "Hieu Nguyen", email = "hieuteo03@gmail.com" }]
dependencies = [
    "cachetools>=5.3.0,<6",
    "ipykernel>=7.2.0,<8",
    "statsforecast>=2.0.3,<3",
    "mlforecast>=1.0.2,<2",
    "fastapi>=0.135.1,<0.136",
    "scipy>=1.7.3,<1.16.0",
    "pydantic>=2.12.5,<3",
    "uvicorn>=0.41.0,<0.42",
    "puremagic>=2.0.0,<3",
    "pydantic-settings>=2.0.0,<3", "mlflow>=3.10.1,<4",
]
description = "Pixi-first MLOps pipeline for FX market data ingestion, feature engineering, training, and evaluation."
name = "MLFX"
readme = "README.md"
requires-python = ">= 3.13"
version = "0.1.0"

[project.scripts]
mlfx = "mlfx.cli.main:main"

[project.optional-dependencies]
serving = [
    "fastapi>=0.135.1,<0.136",
    "pydantic>=2.12.5,<3",
    "uvicorn>=0.41.0,<0.42",
]
integrations = [
    "questdb[dataframe]>=4.1.0,<5",
    "openai>=2.24.0,<3",
    "chromadb>=1.5.2,<2",
    "lmstudio>=1.5.0,<2",
    "agno[os]>=2.5.6,<3",
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["mlfx"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
MLFX = { path = ".", editable = true }

[tool.pixi.tasks]
test = "pytest"
test-unit = "pytest tests/unit/ -v"
test-integration = "pytest tests/integration/ -v"
test-contract = "pytest tests/contract/ -v"
test-e2e = "pytest tests/e2e/ -v"
test-fast = "pytest -m 'not slow' -v"
verify = "pytest tests/contract/ tests/integration/ -v"
clean-generated = "bash -lc 'rm -rf .cache .pixi-cache .pytest_cache .ruff_cache __pycache__ lightning_logs && mkdir -p outputs/models outputs/reports logs && find outputs/models -mindepth 1 ! -name .gitkeep -exec rm -rf {} + && find outputs/reports -mindepth 1 ! -name .gitkeep -exec rm -rf {} + && find logs -mindepth 1 ! -name .gitkeep -exec rm -rf {} +'"

[tool.pixi.dependencies]
polars = ">=1.38.1,<2"
python = ">=3.13.0,<3.14"
ta-lib = ">=0.6.4,<0.7"
pyarrow = ">=23.0.1,<24"
pytest = ">=9.0.2,<10"
aiohttp = ">=3.9,<4"
matplotlib = ">=3.10.8,<4"
plotly = ">=6.5.2,<7"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.8.0,<2"
xgboost = ">=3.2,<4"
lightgbm = ">=4.6.0,<5"
pytorch-cpu = ">=2.10,<3"
optuna = ">=4.7,<5"
shap = ">=0.50,<1"
pandas = ">=2.0.0,<3"
rich = ">=14.3.3,<15"
pytest-cov = ">=7.0.0,<8"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "network: tests that require internet access (deselect with -m 'not network')",
    "unit: fast isolated unit tests",
    "integration: tests spanning multiple modules",
    "contract: API contract verification tests",
    "e2e: end-to-end workflow tests",
    "slow: tests taking >5 seconds",
]
filterwarnings = [
    # Joblib multiprocessing fallback in sandbox/CI (Permission denied → serial mode)
    "ignore:.*joblib will operate in serial mode.*:UserWarning:joblib._multiprocessing_helpers",
    # Protobuf deprecated utcfromtimestamp (third-party, cannot fix in our code)
    "ignore::DeprecationWarning:google.protobuf.internal.well_known_types",
]
