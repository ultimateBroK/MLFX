[project]
authors = [{name = "Hieu Nguyen", email = "hieuteo03@gmail.com"}]
dependencies = ["questdb[dataframe]>=4.1.0,<5", "openai>=2.24.0,<3", "chromadb>=1.5.2,<2", "lmstudio>=1.5.0,<2", "agno[os]>=2.5.6,<3", "textual>=8.0.2,<9", "ipykernel>=7.2.0,<8", "neuralforecast>=3.1.5,<4", "statsforecast>=2.0.3,<3", "mlforecast>=1.0.2,<2", "lightgbm"]
name = "ML_FX"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["indicators", "pipeline", "models", "eval", "viz", "agent"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
ML_FX = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
polars = ">=1.38.1,<2"
python = ">=3.13.0,<3.14"
ta-lib = ">=0.6.4,<0.7"
pyarrow = ">=23.0.1,<24"
pytest = ">=9.0.2,<10"
aiohttp = ">=3.9,<4"
matplotlib = ">=3.10.8,<4"
plotly = ">=6.5.2,<7"
seaborn = ">=0.13.2,<0.14"
scikit-learn = ">=1.8,<2"
xgboost = ">=3.2,<4"
lightgbm = ">=4.6,<5"
pytorch-cpu = ">=2.10,<3"
optuna = ">=4.7,<5"
shap = ">=0.50,<1"
pandas = ">=3.0.1,<4"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "network: tests that require internet access (deselect with -m 'not network')",
]
