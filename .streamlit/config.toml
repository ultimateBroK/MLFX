# MLFX Streamlit UI - Glassmorphism Emerald AMOLED theme
# Base theme; glassmorphism applied via custom CSS injection

[theme]
base = "dark"
primaryColor = "#10B981"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0A0A0A"
textColor = "#F4F4F5"
font = "sans serif"

[theme.dark]
primaryColor = "#10B981"
backgroundColor = "#000000"
secondaryBackgroundColor = "#0A0A0A"
textColor = "#F4F4F5"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false
